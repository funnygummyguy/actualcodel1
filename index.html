<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Countdown + Fake Captcha + Loading</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<h1 id="title">Countdown</h1>

<div id="countdown">60</div>

<div id="captchaSection">
    <h2 id="captchaDisplay">12345</h2>
    <p>Enter the text above:</p>
    <input id="captchaInput" />
    <button onclick="submitCaptcha()">Submit</button>
</div>

<div id="loadingSection">
    <h2>Loading...</h2>
    <div id="progressContainer">
        <div id="progressBar"></div>
    </div>
</div>

<div id="finalMessage">
    <h1>GT7H9I</h1>
</div>

<script src="script.js"></script>
</body>
</html>
